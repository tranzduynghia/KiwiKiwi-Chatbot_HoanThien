<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiwiKiwi Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <!-- Thanh tiêu đề và điều hướng tab -->
  {% include "partials/header.html" %}

  <!-- Thông báo nhanh dạng Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm px-4 py-3 rounded-xl text-sm shadow-xl border"></div>

  <!-- Nội dung chính chia theo từng tab tính năng -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    {% include "partials/status_tab.html" %}
    {% include "partials/ask_config_tab.html" %}
    {% include "partials/prompt_config_tab.html" %}
    {% include "partials/models_tab.html" %}
    {% include "partials/permissions_tab.html" %}
  </main>

  <!-- Dữ liệu khởi tạo từ server cho các module JavaScript -->
  <script id="dashboard-bootstrap" type="application/json">
    {{ {
      "defaultSystemPrompt": default_system_prompt,
      "defaultOcrInstruction": default_ocr_instruction,
      "isAdmin": (true if user.is_admin else false)
    } | tojson }}
  </script>

  <!-- Điểm vào chính của giao diện Dashboard -->
  <script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
