<!-- Tab 3: Chỉnh sửa System Instruction và OCR Instruction theo thời gian thực -->
<section id="tab-prompt" class="tab-panel hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold">System Instruction của Chatbot</h2>
      <p class="text-xs text-slate-400">Chỉnh tính cách, quy tắc trả lời và hướng dẫn OCR theo thời gian thực</p>
    </div>
    <button id="btn-save-prompt" class="btn-primary">💾 Lưu System Instruction</button>
  </div>

  <div class="card p-5 space-y-4">
    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-xs font-medium text-slate-300">System Instruction chính (Chatbot)</label>
        <div class="flex items-center gap-3">
          <span id="prompt-char-count" class="text-[11px] text-slate-500">0 ký tự</span>
          <button type="button" id="btn-reset-sys-prompt" class="text-[11px] text-rose-400 hover:underline">Khôi phục mặc định</button>
        </div>
      </div>
      <textarea id="inp-system-prompt" rows="7" class="inp font-sans leading-relaxed"></textarea>
    </div>

    <label class="inline-flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
      <input id="inp-append-date" type="checkbox" class="accent-indigo-500" />
      Tự động nối dòng <code>Hôm nay là dd/mm/YYYY.</code> vào cuối System Instruction
    </label>

    <div class="pt-3 border-t border-slate-800">
      <div class="flex items-center justify-between mb-1.5">
        <label class="text-xs font-medium text-slate-300">OCR Instruction (dùng khi bật <code>ocr=True</code>)</label>
        <button type="button" id="btn-reset-ocr-prompt" class="text-[11px] text-rose-400 hover:underline">Khôi phục mặc định</button>
      </div>
      <textarea id="inp-ocr-prompt" rows="4" class="inp font-sans leading-relaxed"></textarea>
    </div>
  </div>
</section>
