<!-- Tab Nhật ký chỉnh sửa (Audit Log) kèm Avatar Discord và Modal so sánh thay đổi chi tiết -->
<section id="tab-audit" class="tab-panel hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold text-white">Nhật ký chỉnh sửa (Audit Log)</h2>
      <p class="text-xs text-[#8b95a7]">Theo dõi mọi thay đổi cấu hình, model và phân quyền (tự ẩn trường nhạy cảm)</p>
    </div>
    <div class="flex items-center gap-2">
      <select id="audit-section-filter" class="inp w-48 py-1.5 text-xs">
        <option value="">Tất cả chuyên mục</option>
        <option value="ask">Cấu hình /ask</option>
        <option value="prompt">System Instruction</option>
        <option value="models">Model Gemini</option>
        <option value="discord_permissions">Phân quyền Discord</option>
        <option value="dashboard_users">Tài khoản Dashboard</option>
      </select>
      <button id="btn-refresh-audit" type="button" class="btn-primary">↻ Tải lại</button>
    </div>
  </div>

  <!-- Bảng danh sách nhật ký chỉnh sửa -->
  <div class="card p-5">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="border-b border-[#1e232e] text-[#8b95a7]">
            <th class="py-2.5 pr-3 whitespace-nowrap">Thời gian</th>
            <th class="py-2.5 pr-3">Người thực hiện</th>
            <th class="py-2.5 pr-3">Chuyên mục</th>
            <th class="py-2.5 pr-3">Tóm tắt</th>
            <th class="py-2.5 pr-3 text-center">Trạng thái</th>
            <th class="py-2.5 text-right whitespace-nowrap">Thao tác</th>
          </tr>
        </thead>
        <tbody id="audit-tbody" class="divide-y divide-[#1e232e]/80"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal xem chi tiết diff từng trường thay đổi (không rời khỏi trang Nhật ký) -->
  <div
    id="audit-detail-modal"
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="audit-detail-title"
  >
    <div class="card w-full max-w-4xl max-h-[86vh] flex flex-col shadow-2xl overflow-hidden border border-[#2a3140]">
      <!-- Đầu Modal: thông tin người thực hiện kèm avatar -->
      <div class="p-4 border-b border-[#1e232e] flex items-start justify-between gap-3 bg-[#0e1117]">
        <div id="audit-detail-header" class="flex items-center gap-3 min-w-0">
          <h3 id="audit-detail-title" class="text-sm font-semibold text-white">Chi tiết thay đổi</h3>
        </div>
        <button
          type="button"
          id="btn-close-audit-detail"
          class="ox-icon-btn shrink-0"
          title="Đóng cửa sổ"
          aria-label="Đóng"
        >✕</button>
      </div>

      <!-- Thanh thông tin thời gian chính xác, chuyên mục và tóm tắt -->
      <div id="audit-detail-meta" class="px-4 py-3 bg-[#0a0d12] border-b border-[#1e232e] space-y-1.5 text-xs"></div>

      <!-- Bảng so sánh từng trường: Trường cấu hình | Giá trị gốc -> Giá trị mới -->
      <div id="audit-detail-diff" class="p-4 overflow-y-auto flex-1 bg-[#0c0f14]"></div>
    </div>
  </div>
</section>
